<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}{% endblock %}</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Google+Sans:wght@400;500;700&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@1,900&family=Roboto+Mono:wght@400;500&family=Rubik+Mono+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css" />
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ hashed["site.css"] }}" />
    <script>document.documentElement.classList.add("js")</script>
    <script defer src="{{ hashed["site.js"] }}"></script>
  </head>

  <body>
    <div class="bg"></div>
    {% block body %}{% endblock %}

  </body>
</html>
