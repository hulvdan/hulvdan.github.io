<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Hulvdan</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Google+Sans:wght@400;500;700&family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@1,900&family=Rubik+Mono+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ PORTFOLIO_CSS }}" />
    <script>document.documentElement.classList.add("js")</script>
    <script defer src="{{ PORTFOLIO_JS }}"></script>
  </head>

  <body>
    <div class="bg"></div>
    <div class="wipe" aria-hidden="true"><span>LOADING</span></div>

    {content}

    <dialog id="lb">
      <div class="lb-frame"><img id="lbImg" alt="" /></div>
      <button class="btn lb-nav lb-prev" id="lbPrev" aria-label="Назад">◀</button>
      <button class="btn lb-nav lb-next" id="lbNext" aria-label="Вперёд">▶</button>
      <button class="btn lb-close" id="lbClose">Закрыть</button>
    </dialog>
  </body>
</html>
