[project]
name = "hulvdan-github-io"
version = "0.1.0"
requires-python = ">=3.11.3"
dependencies = [
  "cogapp>=3.6.0",
  "jinja2>=3.1.6",
  "livereload>=2.7.1",
  "markdown2>=2.5.5",
  "pillow>=12.1.1",
  "pygments>=2.19.2",
  "typer>=0.24.1",
]

[dependency-groups]
dev = [
  "prek>=0.5.4",
  "pytest>=9.1.1",
  "ruff>=0.16.10",
  "tombi>=1.7.1",
  "ty>=0.0.84",
]

[tool.black]
line-length = 90

[tool.isort]
multi_line_output = 3
line_length = 90
include_trailing_comma = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""
